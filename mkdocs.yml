site_name: bitvavo-sdk
site_description: Typed Python SDK (sync + async) for the Bitvavo Exchange REST API
repo_url: https://github.com/rebasedaily/coinbase-pro-py
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/brightness-7, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/brightness-4, name: Light mode }

nav:
  - Home: index.md
  - Guide:
      - Getting started: getting-started.md
      - Configuration: configuration.md
      - Authentication: authentication.md
      - Error handling: errors.md
      - Rate limits: rate-limits.md
      - Async usage: async.md
  - Reference:
      - Endpoints: endpoints.md
      - API docs (generated): api.md
  - Development & publishing: development.md

markdown_extensions:
  - admonition
  - tables
  - toc: { permalink: true }
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets: { check_paths: true }

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            heading_level: 2

validation:
  links:
    not_found: ignore
